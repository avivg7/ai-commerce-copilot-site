<title>AI Commerce Copilot is temporarily unavailable</title>
<!--
  Edge-served 5xx page (owner direction): one sentence, nothing else. STANDALONE: no external request of any kind (the upstreams may be down), inline CSS only,
  system fonts, no script, no image file (the mark below is inline SVG), no link. Colours are the brand tokens' literal values (brand/aicc-tokens.css):
  mist #f8fafc, white #ffffff, slate-900 #0f172a, slate-600 #475569, slate-200 #e2e8f0, navy-950 #0b1220, navy-900 #101a2e, slate-300 #cbd5e1,
  blue-600 #2563eb, emerald-500 #10b981. Contrast: light 17.1:1 (text) and 7.5:1 (muted); dark 18.7:1 and 12.6:1. No stack trace, no infrastructure detail,
  nothing about which part is affected. English only: the sentence has no translation in the project dictionaries yet (native translation pending; see
  docs/cutover/runbook.md section 7). Served by the template's handle_errors for every status >= 500, the status code kept.
  Checked by `npm run test:error-page` (static checks, Chromium at 320/390/1280 with axe, light/dark/forced colours).
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #475569;
    --line: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --card: #101a2e;
      --text: #ffffff;
      --muted: #cbd5e1;
      --line: #334155;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 34rem;
    padding: 2rem 1.25rem;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    overflow-wrap: anywhere;
  }
  .mark { display: block; width: 3rem; height: 3rem; margin: 0 auto 1.25rem; }
  h1 {
    margin: 0 0 .5rem;
    font-size: clamp(1.375rem, 1.1rem + 1.4vw, 1.875rem);
    line-height: 1.25;
    letter-spacing: -0.015em;
    font-weight: 650;
  }
  p { margin: 0; color: var(--muted); font-size: 1.0625rem; }
  @media (min-width: 30rem) { body { padding: 1.5rem; } main { padding: 2.75rem 2.5rem; } }
  @media (forced-colors: active) {
    body { background: Canvas; color: CanvasText; }
    main { background: Canvas; border-color: CanvasText; }
    h1, p { color: CanvasText; }
  }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 32 32" width="48" height="48" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2563eb"/>
        <stop offset="1" stop-color="#10b981"/>
      </linearGradient>
    </defs>
    <rect width="32" height="32" rx="10" fill="url(#g)"/>
    <rect x="8" y="10" width="16" height="12" rx="5" fill="#fff" fill-opacity="0.95"/>
    <circle cx="13" cy="16" r="1.6" fill="#0b1220"/>
    <circle cx="19" cy="16" r="1.6" fill="#0b1220"/>
    <path d="M13 19c1 1 5 1 6 0" stroke="#0b1220" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <rect x="14" y="6" width="4" height="3" rx="1.5" fill="#fff" fill-opacity="0.7"/>
  </svg>
  <h1>AI Commerce Copilot is temporarily unavailable.</h1>
  <p>Please try again shortly.</p>
</main>
</body>
</html>
