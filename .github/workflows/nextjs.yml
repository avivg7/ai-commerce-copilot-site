# BUILD AND TEST ONLY. This workflow no longer deploys anything.
#
# The Pages deploy job was removed on purpose (cutover review A12): the public site is served by the edge (docs/cutover/runbook.md), and a merge to `main`
# that deployed to GitHub Pages would silently replace the old site, which is the rollback artifact until the owner retires it. Deployment of `out/` to the edge
# is a manual, owner-approved runbook step (versioned release directory + atomic symlink swap). Do NOT re-add a Pages deploy job or the `pages: write` /
# `id-token: write` permissions without the owner's explicit approval and a new rollback plan.
name: Build and test the Next.js site (no deploy)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Checks
        run: |
          npm run lint
          npm run tokens:check
          npm run pricing:check
          npm run i18n:check
          npm run copy:check
          npm run contrast:check
          npm run brand:check
      - name: Build
        # Domain-root build for the canonical host (owner decision 2026-10-19). Without these two variables a production build
        # uses the old GitHub Pages sub-path /ai-commerce-copilot-site and the apex origin, which breaks every asset and canonical.
        env:
          AICC_BASE_PATH: ""
          SITE_URL: https://www.copilt.org
        run: npm run build
      - name: Origin and SEO check
        run: npm run seo:check
      - name: Performance budget
        run: npm run perf:check
      - name: Keep the static export for 14 days (a build artifact for review only, not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: ./out
          retention-days: 14
