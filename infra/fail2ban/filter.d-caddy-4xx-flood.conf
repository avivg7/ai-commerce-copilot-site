# fail2ban filter "caddy-4xx-flood"  ->  /etc/fail2ban/filter.d/caddy-4xx-flood.conf
# Counts every 4xx response (400-499) in the Caddy JSON access log per client address. Moderate on purpose: a person browsing causes at most a handful
# (a missing favicon, an old bookmark); a path scanner causes dozens per minute. It cannot see 5xx, slow scans, or attacks that stay under the threshold;
# it does not replace the edge's own deny rules (403 for /xmlrpc.php, /wp-admin/ ...), it only stops a noisy source from burning the single vCPU.
[Definition]
failregex = ^\{.*?"remote_ip":"<HOST>".*?"status":4\d\d\b
ignoreregex = ^\{.*?"uri":"/(?:\.well-known/acme-challenge/|favicon\.ico)
datepattern = "ts":{EPOCH}
# fallback if the line above is not accepted:  datepattern = "ts":%%s
