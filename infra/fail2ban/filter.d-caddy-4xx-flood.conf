# fail2ban filter "caddy-4xx-flood"  ->  /etc/fail2ban/filter.d/caddy-4xx-flood.conf
# Counts the 4xx classes a SCANNER produces (400, 401, 403, 404, 405) in the Caddy JSON access log per client address, minus the exemptions below (F-09). Moderate on purpose: a person browsing causes at most a handful
# (a missing favicon, an old bookmark); a path scanner causes dozens per minute. It cannot see 5xx, slow scans, or attacks that stay under the threshold;
# it does not replace the edge's own deny rules (403 for /xmlrpc.php, /wp-admin/ ...), it only stops a noisy source from burning the single vCPU.
#
# 421 is EXCLUDED (architecture review M-6, Linux staging): the edge answers "Misdirected request" 421 to every request whose Host is not one of its names (scanners that use the
# IP address as the host name: 3,172 of them in 47 minutes on staging, from many addresses). Those are already answered by Caddy for free (no PHP, no database), they came from
# a distributed population so the jail never banned anybody for them (9,367 counted failures, 0 bans), and a real client that sends one by accident would burn its own budget.
# Conservative on purpose: only 421 is excluded; 404 on /robots.txt and the rest of the 4xx range still count. Everything else is unchanged.
#
# LOG SHAPE (since the access-log allow-list, review H-5): request.remote_ip / method / uri and "status" are in the same order as before; the old request.headers and resp_headers
# maps are gone and the allow-listed headers follow "status" as flat req_* / resp_* fields. Header values are JSON-escaped, so none of them can forge a "status": token.
#
# F-09 (security review B, 2026-10-23): the jail used to count EVERY 4xx, so any web page could make a visitor's browser fire 60 hidden requests at us
# (<img src="https://www.copilt.org/x-1">, x-2, ...) and get the visitor (and everyone behind the same NAT/CGNAT) banned. Now:
#   * only 400, 401, 403, 404, 405 count (421 = unknown Host, M-6; 429 = already throttled by the application; 408/413/414 are not scanner signatures);
#   * GET/HEAD for static assets never count: by file extension (images, css/js/maps, fonts, media, captions, pdf, txt, xml) and for /_next/static/ and /demo/;
#   * a request the BROWSER itself labels cross-site ("req_sec_fetch_site":"cross-site", logged since this change) never counts. Sec-Fetch-Site is set by the browser and cannot be
#     forged or removed by the attacker's page, so this is what actually closes the forcing attack for requests without an extension. A scanner that sends the header escapes the jail:
#     acceptable, the jail is noise control, the edge's own deny rules are the security boundary;
#   * the threshold in jail.d-aicc-edge.local is higher (100 per 60 s) and the sentinel, which only ever sees 200s, cannot be counted. aicc-wp-login (POSTs, not forceable by an
#     <img>; a cross-site auto-submitted form is the remaining vector there) is documented in its own filter.
[Definition]
failregex = ^\{.*?"remote_ip":"<HOST>".*?"status":(?:400|401|403|404|405)\b
ignoreregex = ^\{.*?"uri":"/(?:\.well-known/acme-challenge/|favicon\.ico)
              ^\{.*?"method":"(?:GET|HEAD)".*?"uri":"/(?:_next/static/|demo/)
              ^\{.*?"method":"(?:GET|HEAD)".*?"uri":"[^"?]*\.(?i:png|jpe?g|gif|webp|avif|svg|ico|css|js|mjs|map|woff2?|ttf|otf|eot|mp4|webm|mp3|vtt|pdf|txt|xml)(?:\?[^"]*)?"
              "req_sec_fetch_site":"cross-site"
datepattern = "ts":{EPOCH}
# fallback if the line above is not accepted:  datepattern = "ts":%%s
