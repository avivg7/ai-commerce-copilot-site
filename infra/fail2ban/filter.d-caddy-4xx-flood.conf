# fail2ban filter "caddy-4xx-flood"  ->  /etc/fail2ban/filter.d/caddy-4xx-flood.conf
# Counts every 4xx response (400-499) EXCEPT 421 in the Caddy JSON access log per client address. Moderate on purpose: a person browsing causes at most a handful
# (a missing favicon, an old bookmark); a path scanner causes dozens per minute. It cannot see 5xx, slow scans, or attacks that stay under the threshold;
# it does not replace the edge's own deny rules (403 for /xmlrpc.php, /wp-admin/ ...), it only stops a noisy source from burning the single vCPU.
#
# 421 is EXCLUDED (architecture review M-6, Linux staging): the edge answers "Misdirected request" 421 to every request whose Host is not one of its names (scanners that use the
# IP address as the host name: 3,172 of them in 47 minutes on staging, from many addresses). Those are already answered by Caddy for free (no PHP, no database), they came from
# a distributed population so the jail never banned anybody for them (9,367 counted failures, 0 bans), and a real client that sends one by accident would burn its own budget.
# Conservative on purpose: only 421 is excluded; 404 on /robots.txt and the rest of the 4xx range still count. Everything else is unchanged.
#
# LOG SHAPE (since the access-log allow-list, review H-5): request.remote_ip / method / uri and "status" are in the same order as before; the old request.headers and resp_headers
# maps are gone and the allow-listed headers follow "status" as flat req_* / resp_* fields. Header values are JSON-escaped, so none of them can forge a "status": token.
[Definition]
failregex = ^\{.*?"remote_ip":"<HOST>".*?"status":(?!421\b)4\d\d\b
ignoreregex = ^\{.*?"uri":"/(?:\.well-known/acme-challenge/|favicon\.ico)
datepattern = "ts":{EPOCH}
# fallback if the line above is not accepted:  datepattern = "ts":%%s
