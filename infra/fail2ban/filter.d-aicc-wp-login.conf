# fail2ban filter "aicc-wp-login"  ->  /etc/fail2ban/filter.d/aicc-wp-login.conf
# Reads the Caddy JSON ACCESS log /var/log/aicc-edge/aicc-edge.log (one JSON object per line; field order as written by Caddy's `filter wrap json`).
#
# WHAT THIS JAIL CAN DETECT (and what it cannot) -- read before trusting it:
#  CAN:  (1) a high RATE of POST requests from one address to the login endpoints /my-account/ (WooCommerce sign-in, also lost-password) and /wp-login.php.
#            Every such POST counts as one hit, successful or not: a customer logs in once, a password-guessing bot posts dozens of times.
#            PRECISE LIMITATION (architecture review M-6): the jail counts EVERY POST to /my-account/ or /wp-login.php (and the /he /es /ru variants) whatever the answer was: a
#            successful sign-in (302), a registration, a lost-password request and a wrong password (200 with an error notice) are all one hit. maxretry 10 within 10 minutes bans the
#            whole ADDRESS for 1 hour on ports 80/443. People behind one NAT address (an office, a mobile CGNAT pool, a shared Wi-Fi) therefore share one budget: ten sign-ins in ten
#            minutes from one office ban the office. There is no per-account view here; the plugin's own throttle (per IP+username) is the account-level control. The host's own
#            address is not exempt unless the operator adds it (below).
#            OPERATOR OVERRIDE of ignoreip: the shipped jail file (jail.d/aicc-edge.local) is replaced by every install, so never edit it. Create the OPTIONAL, operator-owned
#            /etc/fail2ban/jail.d/zz-aicc-local.local (absent by default; read after aicc-edge.local because of its name; never touched by install-stack.sh), for example:
#                [aicc-wp-login]
#                ignoreip = 127.0.0.1/8 ::1 10.19.0.2 203.0.113.0/24
#            then `sudo fail2ban-client -t && sudo systemctl reload fail2ban` and check with `sudo fail2ban-client get aicc-wp-login ignoreip`. Each jail needs its own section.
#        (2) requests answered 403 or 429 on /wp-login.php, /xmlrpc.php, /wp-admin/... and /wp-cron.php. The edge answers 403 to everybody who is not an
#            operator for those paths, so a public client that triggers it more than a few times is a scanner, not a customer.
#  CANNOT: tell a FAILED login from a successful one. WordPress and WooCommerce answer a wrong password with HTTP 200 and an error message in the page (a
#          success is a 302), and the access log does not hold response bodies. It also cannot see slow, distributed attacks (one attempt per hour from
#          thousands of addresses), nor a stolen-but-correct password. The real login defence is the Control Plane's own throttle (per IP+username and per IP,
#          generic errors; AICC_LM_Login_Throttle in the plugin) -- this jail is the OUTER network layer that stops the noisy cases and the scanners.
#  CANNOT: ban the operator by accident: the tunnel arrives from 127.0.0.1 and the jail has ignoreip = 127.0.0.1/8 ::1.
#
# CASE: fail2ban compiles failregex CASE-SENSITIVELY (verified with fail2ban 1.0.2 on Ubuntu 24.04), while the edge denies /XMLRPC.php, /Wp-Login.php ... in any case; the
# path tokens are therefore wrapped in (?i:...) so scanners that vary the case are counted too.
# Anchors: every line starts with the Caddy JSON object. "remote_ip" is the TCP peer (the edge is directly on the internet: no CDN, no proxy).
# Header values inside the log are JSON-escaped (\"), so a client cannot forge a `"method":"POST"` token from a header or a query string.
#
# VERIFY ON THE HOST (not possible on the authoring Mac, fail2ban is not installed here; the regexes were tested with Python `re` only):
#   fail2ban-regex /var/log/aicc-edge/aicc-edge.log /etc/fail2ban/filter.d/aicc-wp-login.conf
#   -> must report "Lines: N lines, 0 ignored, M matched" with a "Date template hit" for the epoch pattern. If the date pattern is rejected by
#      the installed fail2ban version, switch datepattern to the commented fallback below and re-run.
[Definition]
failregex = ^\{.*?"remote_ip":"<HOST>".*?"method":"POST".*?"uri":"(?:/(?:he|es|ru))?/(?i:my-account(?:/lost-password)?/?|wp-login\.php)(?:\?[^"]*)?"
            ^\{.*?"remote_ip":"<HOST>".*?"uri":"[^"?]*(?i:/wp-login\.php|/xmlrpc\.php|/wp-admin/|/wp-cron\.php)[^"]*".*?"status":(?:403|429)\b
ignoreregex =
datepattern = "ts":{EPOCH}
# fallback if the line above is not accepted:  datepattern = "ts":%%s
