# AICC Ops configuration for the PRODUCTION host (www.copilt.org; the Droplet aicc-cp-stage promoted in place). Installed by infra/provision/promote-to-production.sh as /etc/aicc-ops/aicc-ops.toml.
# It is the committed example with a pinned, enumerated set of differences (test_promote.sh compares them): the host label, the certificate/edge probe host name, the Control Plane and
# MySQL schema names, the Control Plane collector ON, the PHP-FPM status collector OFF (owner decision 2026-10-21, see docs/cutover/alerting.md), and the alert overrides at the end.
# NO SECRETS belong in this file: Telegram credentials live in /etc/aicc-ops/secrets.env (sudo aicc-ops-secrets set-telegram).
# AICC Ops example configuration (copy to /etc/aicc-ops/aicc-ops.toml).
# Every value shown is the built-in default unless commented otherwise. Thresholds are PROVISIONAL:
# tune them from staging measurements. NO SECRETS belong in this file (Telegram credentials live in
# /etc/aicc-ops/secrets.env, loaded via systemd LoadCredential).

[general]
host_label = "aicc-cp-prod (production)"   # appears in every alert: host AND environment; not a secret, not PII
banner = ""                      # optional text on every page (use for demo/fixture data)
interval_s = 30                  # base collection loop
proc_root = "/proc"
data_dir = "/var/lib/aicc-ops"

[server]
bind = "127.0.0.1"               # loopback only. The process REFUSES any other address (no flag in the unit)
port = 9190                      # reach it with: ssh -L 9190:127.0.0.1:9190 <host>
max_threads = 8
request_timeout_s = 10

[storage]
db_file = "aicc-ops.sqlite3"
raw_retention_h = 48
rollup5_retention_d = 35
rollup1h_retention_d = 400
max_db_bytes = 157286400         # 150 MiB hard cap (db + wal); oldest rollups pruned first, then raw
min_free_pct = 10                # below this free space on the data filesystem writes are refused (CRITICAL)
maintenance_interval_s = 300

# ---- collectors ---------------------------------------------------------------------------------------------
[collectors.host]
enabled = true
interval_s = 30
timeout_s = 10
mounts = ["/"]
units = ["aicc-edge", "php8.3-fpm", "mysql", "fail2ban", "aicc-backup.timer", "aicc-wp-cron.timer", "aicc-cert-expiry.timer"]   # verify with `systemctl list-units`
systemctl = "systemctl"
net_interface = "auto"           # auto = default-route interface
disk_device = "auto"             # auto = sum of whole disks (vda, sda, nvme0n1, ...)
reboot_required_file = "/var/run/reboot-required"   # only its EXISTENCE is read (host.reboot_required); "" disables. `needrestart` is never run.

[collectors.caddy]
enabled = true
interval_s = 30
timeout_s = 5
url = "http://127.0.0.1:12019/metrics"  # Caddy admin API (AICC_ADMIN_ADDR default), loopback only; needs the global `metrics` option in the Caddyfile
dynamic_handlers = ["reverse_proxy"]    # histogram handlers treated as 'dynamic routes' (PHP)
# count_handlers = ["subroute"]         # restrict request counting to one handler level if metrics double-count (verify on staging)

[collectors.phpfpm]
enabled = false
interval_s = 30
timeout_s = 5
socket = "/run/php/aicc-cp.sock"  # pool socket from infra/php/aicc-pool.conf
status_path = "/fpm-status"      # pm.status_path of the pool (already set in infra/php/aicc-pool.conf)
max_children = 3                 # pm.max_children of the pool; active/total uses max(total, this)

[collectors.fpmlog]              # numbers from infra/systemd/aicc-fpm-log-status.sh (root timer, every minute); enable aicc-fpm-log-status.timer
enabled = true
interval_s = 60
timeout_s = 5
status_file = "/var/lib/aicc/status/fpm-log.json"

[collectors.mysql]
enabled = true
interval_s = 30
timeout_s = 8
client = "mysql"
socket = "/var/run/mysqld/mysqld.sock"
user = "aicc_monitor"            # socket-authenticated, no password (see sql/monitoring-user.sql)
database = "aicc_cp"             # schema name for the DB-size metric (visible tables only)

[collectors.cp]                  # Control Plane aggregate counters; enable after the CP plugin created aicc_ops_counters
enabled = true
interval_s = 60
timeout_s = 10
client = "mysql"
socket = "/var/run/mysqld/mysqld.sock"
user = "aicc_monitor"
database = "aicc_cp"
prefix = "wp_"
window_minutes = 5
outbox_max_attempts = 8       # AICC_LM_Entitlement_Dispatcher::MAX_ATTEMPTS: entitlement outbox gauges (pending / oldest age / abandoned) alert as entitlement_outbox_stale (WARNING, > 15 min) and entitlement_outbox_abandoned (CRITICAL, > 0). Needs SELECT on <prefix>aicc_lm_entitlement_outbox (sql/monitoring-user.sql); absent = "not reporting", never an alert

[collectors.backups]
enabled = true
interval_s = 300
timeout_s = 5
dir = "/srv/aicc/backups"            # 0751 root: status.json is readable by name, the directory is not listable
patterns = ["aicc_cp-*.sql.gz", "aicc-files-*.tar.gz"]   # only used if the directory is listable
status_file = "/srv/aicc/backups/status.json"   # schema 1 from infra/backup/aicc-backup.sh
offhost_ack_file = "/srv/aicc/backups/offhost-ack.json"   # schema 1, written by the owner's Mac after a VERIFIED pull; must be readable by the aicc-ops user; "" disables

[collectors.secupdates]          # hourly security-update job (infra/systemd/aicc-security-updates.sh); numbers only, no package versions
enabled = true
interval_s = 300
timeout_s = 5
status_file = "/var/lib/aicc/status/security-updates.json"

[collectors.unitstatus]          # unit-<name>.json files from infra/systemd/aicc-unit-status.sh (OnFailure= hook)
enabled = true
interval_s = 60
timeout_s = 5
dir = "/var/lib/aicc/status"

[collectors.cert]
enabled = true
interval_s = 3600
timeout_s = 5
hostname = "www.copilt.org"
host = "127.0.0.1"
port = 443
cert_file = ""

[collectors.edge]
enabled = true
interval_s = 30
timeout_s = 5
hostname = "www.copilt.org"
host = "127.0.0.1"
port = 443
path = "/healthz"
expect_status = 200

[collectors.backend_metrics]     # OPTIONAL, API host only. Needs AICC_METRICS_ENABLED on the backend (production change + owner approval). Keep disabled.
enabled = false
interval_s = 30
timeout_s = 5
url = "http://127.0.0.1:9108/metrics"   # loopback only; sent with a bearer token and NO proxy / forwarding headers
token_file = "/etc/aicc/metrics.token"  # 0600, readable only by the aicc-ops user; path only, never the token

[collectors.postgres]            # OPTIONAL, API host only. Needs a PRODUCTION CHANGE + owner approval. Keep disabled.
enabled = false
interval_s = 60
timeout_s = 8
client = "psql"
host = "/var/run/postgresql"
user = "aicc_monitor"
database = "postgres"

# ---- capacity (informational only) ---------------------------------------------------------------------------
[capacity]
upgrade_ram_p95_pct = 85.0
upgrade_min_available_mib = 150
upgrade_min_available_episodes = 2
upgrade_swap_in_pps = 50.0
upgrade_swap_sustained_min = 10
upgrade_swap_days = 3
upgrade_cpu_p95_pct = 85.0
upgrade_fpm_reached_days = 3
upgrade_latency_ms = 2000.0
latency_sustain_points = 6
latency_min_rps = 0.1
watch_ram_p95_pct = 75.0
watch_cpu_p95_pct = 70.0
watch_swap_in_pps = 1.0
watch_latency_ms = 1500.0
watch_fpm_ratio = 0.8
watch_db_conn_pct = 70.0
upgrade_db_conn_pct = 90.0
watch_load_per_vcpu = 1.5
upgrade_load_per_vcpu = 3.0

# ---- alerts --------------------------------------------------------------------------------------------------
[alerts]
enabled = true
flap_window_s = 1800
flap_max_transitions = 4
# Per-rule overrides: [alerts.rules.<rule_id>] with enabled, for_samples, clear_samples, crit_samples,
# cooldown_s, renotify_s, renotify_critical_s, or any threshold name (warn, crit, clear, ...). Examples:
# [alerts.rules.ram_high]
# warn = 88
# for_samples = 20
# [alerts.rules.disk_low]
# enabled = true

# ---- production overrides (each one justified by a MEASUREMENT on the host, docs/cutover/alerting.md section 1a) -----------------------------------------------------------------------
# wc_cron_stale: with no store traffic the only completed Action Scheduler action is a roughly hourly housekeeping job, so the fallback heartbeat (age of the last completed action)
# peaks at 3680 s over 7 days and crossed the 3600 s default ~5 times in 24 h (FIRING + RECOVERED pairs, each would be a Telegram message). 7200 s = twice the observed maximum; the CRITICAL
# default (14400 s) is unchanged. A DEAD cron timer is still caught immediately by service_down (aicc-wp-cron.timer is in the unit list) and unit_failed.
[alerts.rules.wc_cron_stale]
warn_s = 7200

# BEGIN DARK-PRODUCTION OVERRIDES (removed automatically by `promote-to-production.sh final-edge` on cutover day)
# While the edge serves www/apex with Caddy's INTERNAL CA (pre-cutover) the served certificate lives 12 hours, so cert_expiry would be CRITICAL for a harmless reason.
[alerts.rules.cert_expiry]
enabled = false
# END DARK-PRODUCTION OVERRIDES
#
# Added rules and their thresholds (values shown are the defaults):
# [alerts.rules.ram_available_low]  # AVAILABLE memory in MiB (ram_high is on used%); sustained 5 min (for_samples/crit_samples = 10 at 30 s)
# warn_mib = 200                    # WARNING below this
# crit_mib = 120                    # CRITICAL below this
# clear_mib = 300                   # recovers only above this
# [alerts.rules.offhost_stale]      # "Off-host backup copy is stale": age of the Mac's last VERIFIED pull confirmation (offhost-ack.json)
# warn_h = 36                       # WARNING when the newest confirmation is older than this
# crit_h = 96                       # CRITICAL when older than this
# clear_h = 30                      # recovers only below this
# absent_after_uptime_h = 48        # no ack file at all: WARNING only once the host has been up this long AND a successful backup exists

# ---- telegram (outbound only; credentials are NEVER here) ------------------------------------------------------
[telegram]
enabled = true                   # still inactive unless the secrets file/credential exists
secrets_file = "/etc/aicc-ops/secrets.env"
min_interval_s = 2.0
max_per_hour = 30
retries = 3
backoff_s = 2.0
digest_enabled = false           # daily digest OFF by default
