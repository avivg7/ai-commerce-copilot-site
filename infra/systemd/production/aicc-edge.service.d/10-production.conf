# Installed ONLY by infra/provision/promote-to-production.sh (never by install-stack.sh, so a staging host can never get it) as
# /etc/systemd/system/aicc-edge.service.d/10-production.conf. It switches the edge unit from the stage preflight to the production preflight; everything else
# in aicc-edge.service (sandbox, memory limits, restart policy) is identical for both environments. The preflight in production mode refuses to start without
# AICC_ALLOW_PRODUCTION_MODE=1 in /etc/aicc-edge/edge.env (written by the promotion) and, while the host is "dark", also needs AICC_ALLOW_INTERNAL_TLS=1 (removed on cutover day).
# An empty ExecStartPre=/ExecReload= line clears the list inherited from the main unit before the new lines are added.
[Service]
ExecStartPre=
ExecStartPre=/usr/local/sbin/aicc-edge-preflight --mode production --caddyfile /etc/aicc-edge/Caddyfile --env-file /etc/aicc-edge/edge.env --caddy /usr/local/bin/caddy
ExecReload=
ExecReload=/usr/local/sbin/aicc-edge-preflight --mode production --caddyfile /etc/aicc-edge/Caddyfile --env-file /etc/aicc-edge/edge.env --caddy /usr/local/bin/caddy --quiet
ExecReload=/usr/local/bin/caddy reload --config /etc/aicc-edge/Caddyfile --adapter caddyfile --address 127.0.0.1:12019 --force
