# Installed ONLY by infra/provision/promote-to-production.sh as /etc/systemd/system/aicc-cert-expiry.service.d/10-production.conf. The staging unit checks stage.copilt.org; the promoted
# host serves www.copilt.org AND the apex copilt.org (two separate certificates in Caddy). The timer stays OFF while the edge presents Caddy's 12-hour internal certificate (dark
# production) and is enabled by `promote-to-production.sh final-edge`. An empty ExecStart= clears the inherited line first.
[Unit]
Description=AICC TLS certificate expiry check (www.copilt.org and copilt.org)

[Service]
ExecStart=
ExecStart=/usr/local/sbin/aicc-cert-expiry-check --host www.copilt.org --host copilt.org --connect 127.0.0.1:443 --warn-days 21 --crit-days 7
