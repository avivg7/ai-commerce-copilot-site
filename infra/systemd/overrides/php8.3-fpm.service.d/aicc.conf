# systemd drop-in  ->  /etc/systemd/system/php8.3-fpm.service.d/aicc.conf
# Boot order: mysql first, then php8.3-fpm, then aicc-edge (aicc-edge.service has After=php8.3-fpm.service).
# Memory: ceiling for the whole PHP-FPM service. 3 workers x 192M memory_limit = 576M worst case + master + OPcache (128M shared) ~ 735M. The cgroup
# throttles at 640M (MemoryHigh: reclaim pressure, slower, no kill) and kills at 900M (MemoryMax) so a runaway PHP can never take MySQL down with it.
[Unit]
After=mysql.service
Wants=mysql.service
OnFailure=aicc-notify-failure@%n.service

[Service]
Restart=on-failure
RestartSec=2s
MemoryHigh=640M
MemoryMax=900M
TasksMax=128
# /run/php must exist and survive a stop (the pool socket lives there)
RuntimeDirectory=php
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes
# Replace the distro's pre-start helper (it only maintains a convenience symlink for the default www pool, which is disabled on this host) with a
# configuration test: a broken pool file now fails the start/restart here instead of killing the running service later.
ExecStartPre=
ExecStartPre=/usr/sbin/php-fpm8.3 --test --fpm-config /etc/php/8.3/fpm/php-fpm.conf
ExecStartPost=-+/usr/local/sbin/aicc-unit-status ok %n

# ---- NETWORK LOCK (security review M1, 2026-10-21): the PHP user must not reach Caddy's UNAUTHENTICATED admin API (127.0.0.1:12019), the loopback operator listener (127.0.0.1:8443)
# or AICC Ops (127.0.0.1:9190), nor the cloud metadata service. A cgroup-level eBPF filter on this unit (the workers, the master and ExecStartPre), so it holds even for raw
# PHP sockets / file_get_contents, which WP_ACCESSIBLE_HOSTS does not cover.
# WHAT PHP-FPM + WordPress + WooCommerce + this plugin need on the loopback: NOTHING. MySQL is the unix socket /run/mysqld/mysqld.sock (skip-networking, wp-config DB_HOST
# 'localhost:/run/mysqld/mysqld.sock'), Caddy talks to the pool over /run/php/aicc-cp.sock, WP-Cron is a systemd timer (DISABLE_WP_CRON), Action Scheduler's async runner is off
# (plugin), the only outbound HTTP the plugin makes is the entitlement webhook. 127.0.0.53 is systemd-resolved's stub: name resolution keeps working.
# PRODUCTION NOTE: the Control Plane must reach api.copilt.org (the entitlement webhook). That is an OUTBOUND public address: it is not denied here (only loopback and link-local
# are), so no IPAddressAllow is needed for it; keep WP_HTTP_BLOCK_EXTERNAL=true with WP_ACCESSIBLE_HOSTS=api.copilt.org in wp-config (the production wp-config template in infra/provision, a record of required settings).
# NEVER add 127.0.0.1 / 169.254.169.254 to IPAddressAllow on staging or production.
IPAddressDeny=127.0.0.0/8 ::1/128 169.254.0.0/16
IPAddressAllow=127.0.0.53/32
