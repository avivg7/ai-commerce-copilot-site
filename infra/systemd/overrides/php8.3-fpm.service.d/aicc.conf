# systemd drop-in  ->  /etc/systemd/system/php8.3-fpm.service.d/aicc.conf
# Boot order: mysql first, then php8.3-fpm, then aicc-edge (aicc-edge.service has After=php8.3-fpm.service).
# Memory: ceiling for the whole PHP-FPM service. 3 workers x 192M memory_limit = 576M worst case + master + OPcache (128M shared) ~ 735M. The cgroup
# throttles at 640M (MemoryHigh: reclaim pressure, slower, no kill) and kills at 900M (MemoryMax) so a runaway PHP can never take MySQL down with it.
[Unit]
After=mysql.service
Wants=mysql.service
OnFailure=aicc-notify-failure@%n.service

[Service]
Restart=on-failure
RestartSec=2s
MemoryHigh=640M
MemoryMax=900M
TasksMax=128
# /run/php must exist and survive a stop (the pool socket lives there)
RuntimeDirectory=php
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes
# Replace the distro's pre-start helper (it only maintains a convenience symlink for the default www pool, which is disabled on this host) with a
# configuration test: a broken pool file now fails the start/restart here instead of killing the running service later.
ExecStartPre=
ExecStartPre=/usr/sbin/php-fpm8.3 --test --fpm-config /etc/php/8.3/fpm/php-fpm.conf
ExecStartPost=-+/usr/local/sbin/aicc-unit-status ok %n
