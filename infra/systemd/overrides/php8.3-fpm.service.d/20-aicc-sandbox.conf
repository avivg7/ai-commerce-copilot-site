# systemd drop-in  ->  /etc/systemd/system/php8.3-fpm.service.d/20-aicc-sandbox.conf
# Sandbox for PHP-FPM (security review M1: `systemd-analyze security php8.3-fpm` scored 9.6 UNSAFE; PHP-FPM runs all of WordPress, WooCommerce and the plugin, the largest RCE surface).
# Kept in its OWN file so that it can be removed on its own (`rm` it, `systemctl daemon-reload`, `systemctl restart php8.3-fpm`) without touching memory limits, ordering or the network
# lock in aicc.conf. Everything here is compatible with: the pool in infra/php/aicc-pool.conf (unix socket, user aicc-cp, sys_temp_dir /var/lib/aicc-cp/tmp, sessions
# /var/lib/aicc-cp/sessions, slowlog and error_log in /var/log/aicc-cp, the mail sink writing /var/lib/aicc-cp/mail), immutable root-owned releases (/srv/aicc/cp/releases) and uploads
# in /srv/aicc/shared/uploads.
#
# NOT EXERCISED ON A RUNNING SYSTEMD (the authoring Mac has none and the Ubuntu container harness could not run a PID 1 systemd in this round; `systemd-analyze verify` accepts the
# file). First start on the host: `sudo systemctl daemon-reload && sudo systemctl restart php8.3-fpm`, then `curl -sI https://<host>/pricing/`, `sudo journalctl -u php8.3-fpm -n 30`,
# `sudo -u aicc-cp wp --path=/srv/aicc/cp/current cron event list`, and `systemd-analyze security php8.3-fpm`. If anything fails to start, remove this file.
#
# DELIBERATELY NOT SET:
#   MemoryDenyWriteExecute=yes   PHP's PCRE JIT (pcre.jit=1, the default) maps memory writable+executable; this directive would turn every preg_* call into a failure or a fallback. Evidence
#                                of the conflict is documented by PHP (pcre.jit must be 0 under MDWE); not worth the loss.
#   SystemCallFilter=            an untested filter ends in SIGSYS on the first denied call (WooCommerce, gd/imagick-less image handling, intl); same reasoning as aicc-edge.service.
#   ProtectProc= / ProcSubset=   WordPress reads nothing from /proc that matters, but PHP-FPM's status/ping and some libraries do; no gain worth a failure mode.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectHome=yes
ProtectSystem=strict
# writable: uploads, the pool's private state and logs. /run/php is writable through RuntimeDirectory= in aicc.conf. The distro's global FPM log is a file that logrotate maintains.
ReadWritePaths=/srv/aicc/shared/uploads /var/lib/aicc-cp /var/log/aicc-cp -/var/log/php8.3-fpm.log
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
# AF_NETLINK: glibc's getaddrinfo() enumerates interfaces through rtnetlink. AF_INET/AF_INET6: the entitlement webhook. AF_UNIX: MySQL, the pool socket, journald.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# The master runs as root and must: setuid/setgid to aicc-cp (SETUID, SETGID), chown the listen socket to aicc-cp:aicc-edge and chmod it afterwards (CHOWN, FOWNER), open the global
# log and read config regardless of directory modes (DAC_OVERRIDE), signal its workers, which run as another user (KILL). Nothing else. Workers hold no capability at all.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE CAP_KILL
