# systemd drop-in  ->  /etc/systemd/system/mysql.service.d/aicc.conf
# Memory: expected resident size ~330-400 MiB with infra/mysql/99-aicc.cnf (buffer pool 192M, performance_schema off, 30 connections).
# MemoryHigh 600M throttles a pathological query; MemoryMax 720M kills mysqld before it can starve the rest (it restarts and InnoDB recovers).
# OOMScoreAdjust -500: if the kernel OOM killer ever runs, PHP workers (which respawn in milliseconds) are chosen before the database.
[Unit]
OnFailure=aicc-notify-failure@%n.service

[Service]
Restart=on-failure
RestartSec=5s
MemoryHigh=600M
MemoryMax=720M
OOMScoreAdjust=-500
LimitNOFILE=8192
ExecStartPost=-+/usr/local/sbin/aicc-unit-status ok %n
