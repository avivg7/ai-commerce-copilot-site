; AICC PHP settings for the FPM SAPI  ->  /etc/php/8.3/fpm/conf.d/90-aicc.ini  (loaded after Ubuntu's 10-opcache.ini)
; Only settings that cannot be set per pool live here (PHP_INI_SYSTEM / PHP_INI_PERDIR). Per-pool limits are in aicc-pool.conf.
; Host: 1 vCPU / 2 GiB. Rationale for every value is in the comment above it.

[PHP]
expose_php = Off
; WordPress behind Caddy's php_fastcgi: no PATH_INFO guessing by the SAPI (the edge splits the path itself)
cgi.fix_pathinfo = 0
date.timezone = UTC
output_buffering = 4096
; Caddy compresses (zstd/gzip); compressing twice would only burn the single CPU.
zlib.output_compression = Off
; -1: assert() calls are not even compiled (production setting; cannot be changed at runtime)
zend.assertions = -1
allow_url_include = Off
; WordPress' HTTP API (update checks are disabled, but plugin REST calls to the AICC backend use it)
default_socket_timeout = 20
; Path resolution cache. Default 4M/120s. 2M is plenty for ~12k files. The TTL matters for atomic releases: the docroot is the symlink
; /srv/aicc/cp/current, and a stale cached realpath could keep serving the OLD release for up to 120 s after the swap. activate-release.sh
; therefore gracefully reloads PHP-FPM right after the swap (this clears realpath + opcache); the Caddyfile should also set
; `resolve_root_symlink` on php_fastcgi so SCRIPT_FILENAME already carries the real release path (see infra/release/README.md).
realpath_cache_size = 2M
realpath_cache_ttl = 120
; Session id strength: explicit so a distro change cannot weaken it (48 chars x 6 bits).
session.sid_length = 48
session.sid_bits_per_character = 6

[opcache]
opcache.enable = 1
; CLI runs (WP-CLI cron every minute, deploy tasks) must not use or poison the shared cache and must see fresh files.
opcache.enable_cli = 0
; 128 MiB shared memory. MEASURED (PHP 8.3.6, WordPress 7.1.3 + WooCommerce 10.9.4 + Storefront + AICC plugin/theme, Ubuntu 24.04 container): after warming the front end,
; the REST index and the store API OPcache held 1,709 scripts in 68 MiB; wp-admin and WooCommerce's admin classes add several hundred more files, so 96 MiB would run at
; ~95-100% on the first admin visit (OPcache then stops caching new scripts and slows down). 128 leaves ~25% headroom; the 32 MiB cost is in the budget (infra/README.md).
; Shared once for all workers, and recreated by the graceful reload that follows every release swap, so the old and the new release never coexist in it.
opcache.memory_consumption = 128
; 16 MiB for interned strings (default 8): measured 10.8 MiB used after the same warm-up (WooCommerce has many long class/hook names); shared once, not per worker.
opcache.interned_strings_buffer = 16
; Number of cached scripts: must be above the real file count; PHP rounds up to the next prime (16229 is one).
opcache.max_accelerated_files = 16229
; IMMUTABLE RELEASES: files never change after a release is activated, so PHP must not stat() every file on every request.
; New code is picked up ONLY by the graceful PHP-FPM reload that activate-release.sh performs after the symlink swap (SIGUSR2 re-creates the
; shared memory). Consequence: editing a file inside an active release has NO effect until the next reload; never edit releases in place.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
; keep doc comments: WooCommerce and several libraries read annotations/docblocks (save_comments=0 breaks them)
opcache.save_comments = 1
opcache.enable_file_override = 0
opcache.max_wasted_percentage = 10
; JIT off: no measurable gain for WordPress, costs memory and adds risk on a 2 GiB host
opcache.jit = disable
opcache.jit_buffer_size = 0
