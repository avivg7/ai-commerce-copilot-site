; AICC Control Plane PHP-FPM pool "aicc"  ->  installed as /etc/php/8.3/fpm/pool.d/aicc.conf by infra/provision/install-stack.sh
; (the distro's default pool www.conf is moved aside by the installer: it would run a second, unused pool and waste RAM).
;
; HOST: DigitalOcean Basic Regular, 1 vCPU / 2 GiB RAM / 2 GiB swap (swappiness 10). Every number below is justified for THAT size.
; The owner chose the small size on purpose; if the host is ever resized, re-derive these numbers from the budget in infra/README.md.
;
; MEMORY MODEL (see the budget table in infra/README.md):
;   * OPcache lives in shared memory once (128 MiB, infra/php/90-aicc-fpm.ini), NOT per worker.
;   * A WordPress + WooCommerce request typically has a resident set of 50-90 MiB per worker (measured on the rehearsal fixture is NOT
;     representative, so treat this as an estimate to be confirmed with /fpm-status + `ps` on the real host).
;   * Hard ceiling = pm.max_children x memory_limit = 3 x 192 MiB = 576 MiB. That is the worst case, reached only if all three workers
;     hit the limit at once; the systemd drop-in (infra/systemd/overrides/php8.3-fpm.service.d/aicc.conf) additionally caps the whole service.

[aicc]
user = aicc-cp
group = aicc-cp

; Unix socket (no TCP port at all). Owner aicc-cp, group aicc-edge, mode 0660: ONLY the Caddy user (aicc-edge) and PHP itself may connect.
; Nothing else on the host can talk FastCGI to this pool (a FastCGI client can execute any .php file under the pool's user).
listen = /run/php/aicc-cp.sock
listen.owner = aicc-cp
listen.group = aicc-edge
listen.mode = 0660
; backlog 128: with 3 workers on 1 vCPU a longer queue only turns overload into latency; Caddy returns 502/504 sooner instead.
listen.backlog = 128

; --- process manager -------------------------------------------------------------------------------------------------------------
; dynamic, max 3: one vCPU runs one PHP request at a time; the extra workers exist to overlap MySQL/HTTP waits, not to add CPU.
; More than 3 would only let a burst eat the RAM that MySQL's buffer pool needs.
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
; Recycle a worker after 300 requests: bounds slow memory growth in WordPress plugins without paying the restart cost often.
pm.max_requests = 300

; Health/metrics endpoints. They are reached through the FastCGI socket only (AICC Ops reads /fpm-status itself over the socket).
; The edge must NOT route /fpm-status or /fpm-ping from the public internet (the Caddyfile only proxies WordPress paths).
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Slow request log: a request running longer than 5 s gets a PHP stack trace here (aicc-cp owned, rotated by infra/logrotate/aicc-php).
request_slowlog_timeout = 5s
slowlog = /var/log/aicc-cp/php-slow.log

; Hard kill. max_execution_time does NOT count time spent waiting in syscalls (MySQL, HTTP calls) on Linux, so FPM enforces its own limit.
; The edge waits 60 s for response headers (AICC_WP_TIMEOUT / docs/cutover/Caddyfile.edge.template): PHP stops itself at 50 s with a
; clean PHP error, FPM kills at 55 s, and Caddy would only give up at 60 s. The visitor therefore sees the application error, not a bare 504.
request_terminate_timeout = 55s

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
security.limit_extensions = .php
chdir = /
rlimit_core = 0

; --- PHP settings that must not be overridable by application code (php_admin_*) ------------------------------------------------
php_admin_value[memory_limit] = 192M
php_admin_value[max_execution_time] = 50
php_admin_value[max_input_time] = 30
; max_input_vars: WooCommerce product/variation editing posts well over the default 1000 fields.
php_admin_value[max_input_vars] = 3000

; Upload limits. The PUBLIC edge caps request bodies at 2 MB (wp_body_cap); the operator-only /wp-admin/ route, reached through the loopback
; tunnel, allows 64 MB (to_wordpress_admin; Caddy's "64MB" is 64,000,000 bytes, below PHP's 64M = 67,108,864, so the edge cap always wins).
; PHP must allow what the OPERATOR path allows (media/plugin data imports); it cannot be 2 MB or admin uploads would fail.
; Public traffic can never exceed 2 MB because the edge refuses first. post_max_size is slightly above upload_max_filesize (multipart overhead).
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 65M
php_admin_value[max_file_uploads] = 20
php_admin_value[upload_tmp_dir] = /var/lib/aicc-cp/tmp
php_admin_value[sys_temp_dir] = /var/lib/aicc-cp/tmp

; Errors: logged to a file the pool owns, never shown to visitors.
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/aicc-cp/php-error.log
php_admin_value[error_reporting] = 22527
; (22527 = E_ALL & ~E_DEPRECATED & ~E_STRICT: deprecation notices from third-party plugin code are noise on a production-like host)

; Outgoing mail NEVER leaves this host (staging): PHP's mail() hands the message to this sink, which writes a file (see infra/php/aicc-mail-sink.sh).
; For production this single line is replaced by a real MTA/SMTP decision (owner input, docs/cutover/dns-and-mail.md).
php_admin_value[sendmail_path] = /usr/local/sbin/aicc-mail-sink

; Process-spawning functions are disabled for web requests. WordPress core, WooCommerce and the AICC plugin/theme do not call them on the request
; path (images use GD, ZIP uses ext-zip); a compromised plugin could otherwise spawn a shell. This is defence in depth, not a sandbox.
; It applies to the FPM pool ONLY: WP-CLI (cron, deploy) runs under php-cli with its own ini and still has proc_open.
; If a future plugin legitimately needs one of them, remove that single name here in a reviewed commit, never the whole line.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,posix_kill,posix_mkfifo,posix_setuid,posix_setgid

; Sessions (WordPress and WooCommerce use their own cookies, but plugins may call session_start()).
php_admin_value[session.save_path] = /var/lib/aicc-cp/sessions
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_flag[session.use_trans_sid] = off

php_admin_flag[allow_url_include] = off
