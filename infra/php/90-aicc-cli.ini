; AICC PHP settings for the CLI SAPI (WP-CLI: cron every minute, deploy/maintenance tasks)  ->  /etc/php/8.3/cli/conf.d/90-aicc.ini
; Same memory ceiling as the web pool so a CLI task cannot take more RAM than a request could; the systemd units add MemoryMax=256M on top.
[PHP]
memory_limit = 192M
; CLI has no execution limit (WP-CLI long tasks such as imports); the systemd unit's TimeoutStartSec is the limit for cron
max_execution_time = 0
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /var/log/aicc-cp/php-cli-error.log
sys_temp_dir = /var/lib/aicc-cp/tmp
sendmail_path = /usr/local/sbin/aicc-mail-sink
zend.assertions = -1
[opcache]
; never cache in CLI: with validate_timestamps=0 a cached script would be stale for a later run
opcache.enable_cli = 0
